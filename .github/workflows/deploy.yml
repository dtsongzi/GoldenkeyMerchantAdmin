name: Deploy GoldenKey Merchant Admin to ECS

# 触发：push 到 master（或手动 Run workflow）
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   ECS_HOST / ECS_USER / ECS_SSH_KEY（私钥全文）/ ECS_PORT（可选，默认 22）
# 服务器前置条件：nginx；静态产物落到 /opt/GoldenKeyAdmin。
# 访问路径：页面 /goldenkeyadmin/（构建 base=/goldenkeyadmin/），接口 /goldenkey/api/*。
# 站点配置以 deploy/nginx.goldenkey.conf 为准，内容有变化会被同步到服务器（失败自动回滚）。
on:
  push:
    branches: [master]
  workflow_dispatch:

# 与后端部署分开分组，互不取消；同一应用只允许一个部署
concurrency:
  group: deploy-goldenkey-admin
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DEPLOY_PATH: '/opt/GoldenKeyAdmin'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 缺 secrets 时直接给出清单，而不是让 scp 抛一句 Could not resolve hostname
      - name: Preflight deploy secrets
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
        run: |
          set -e
          missing=""
          check() { [ -n "$2" ] || missing="$missing $1"; }
          check ECS_SSH_KEY "$SSH_KEY"
          check ECS_HOST "$R_HOST"
          check ECS_USER "$R_USER"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing（Settings → Secrets and variables → Actions 里补上）"
            exit 1
          fi
          echo "secrets 齐备"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist assets
        run: |
          set -e
          test -s dist/index.html
          for f in dist/assets/*.js; do node --check "$f"; done
          # 站点挂在 /goldenkeyadmin/ 下，产物必须引用 /goldenkeyadmin/assets/（base 配错会静默 404）
          grep -q '/goldenkeyadmin/assets/' dist/index.html || { echo "::error::index.html 未引用 /goldenkeyadmin/assets/，检查 vite.config.js 的 base"; exit 1; }
          # 产物清单用于服务器侧完整性校验（CSS 可能没有，用 find 避免通配落空）
          (cd dist && { sha256sum index.html; find assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sha256sum; } > MANIFEST.sha256)
          echo "dist OK: $(wc -l < dist/MANIFEST.sha256 | tr -d ' ') files verified, $(du -sh dist | cut -f1)"

      - name: Package dist
        run: |
          set -e
          # 带上 nginx 站点配置，服务器侧会与当前配置比对后同步
          cp deploy/nginx.goldenkey.conf dist/nginx.goldenkey.conf
          tar czf goldenkey-admin-dist.tar.gz -C dist .
          ls -lh goldenkey-admin-dist.tar.gz

      - name: Upload artifact to server (scp)
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
          R_PORT: ${{ secrets.ECS_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "Uploading $(du -h goldenkey-admin-dist.tar.gz | cut -f1) to ${R_HOST}:/tmp/ ..."
          timeout 300s scp -O \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -P "${R_PORT:-22}" \
            goldenkey-admin-dist.tar.gz "${R_USER}@${R_HOST}:/tmp/"
          echo "scp done"

      - name: Remote deploy (ssh)
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
          R_PORT: ${{ secrets.ECS_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          timeout 420s ssh \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p "${R_PORT:-22}" "${R_USER}@${R_HOST}" 'bash -s' <<'REMOTE'
          set -eo pipefail
          export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          STAGE="$(mktemp -d /tmp/gk-admin-XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT

          tar xzf /tmp/goldenkey-admin-dist.tar.gz -C "$STAGE"
          rm -f /tmp/goldenkey-admin-dist.tar.gz
          (cd "$STAGE" && sha256sum -c MANIFEST.sha256)

          # 原子切换：前端产物无状态，旧目录整体替换
          rm -rf "$DEPLOY_PATH"
          mv "$STAGE" "$DEPLOY_PATH"
          trap - EXIT
          chmod -R 755 "$DEPLOY_PATH"
          echo "Admin deploy OK: $DEPLOY_PATH"

          # nginx 站点：以仓库里的 deploy/nginx.goldenkey.conf 为准。
          # 各面板/发行版的 vhost 包含目录不同（宝塔是 /www/server/panel/vhost/nginx，
          # Debian 系是 /etc/nginx/conf.d 或 sites-enabled），逐个试：
          # 写进去 → nginx -t 校验（不过就回滚）→ reload → 看 8088 是否真的响应，成功即停。
          if command -v nginx >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo -n"; fi
            DESIRED="$DEPLOY_PATH/nginx.goldenkey.conf"
            CANDIDATES="/www/server/panel/vhost/nginx /etc/nginx/conf.d /etc/nginx/sites-enabled /etc/nginx/vhosts"
            check_site() { curl -s -o /dev/null -w "%{http_code}" --noproxy '*' --max-time 5 "http://127.0.0.1:8088/goldenkeyadmin/" || true; }
            SITE_DIR=""
            for dir in $CANDIDATES; do
              if ! $SUDO test -d "$dir" 2>/dev/null; then continue; fi
              target="$dir/goldenkey-admin.conf"
              had=0
              if $SUDO test -f "$target"; then had=1; $SUDO cp "$target" /tmp/gk-nginx-prev.bak 2>/dev/null || true; fi
              if ! $SUDO cp "$DESIRED" "$target" 2>/dev/null; then
                echo "· $dir 不可写，跳过"
                continue
              fi
              if ! $SUDO nginx -t 2>/dev/null; then
                if [ "$had" = "1" ]; then $SUDO cp /tmp/gk-nginx-prev.bak "$target"; else $SUDO rm -f "$target"; fi
                echo "· $dir：nginx -t 未通过，已回滚"
                continue
              fi
              $SUDO systemctl reload nginx 2>/dev/null || $SUDO nginx -s reload 2>/dev/null || true
              sleep 1
              CODE=$(check_site)
              if [ "$CODE" = "200" ]; then
                SITE_DIR="$dir"
                echo "站点已生效：$target （/goldenkeyadmin/ → 200）"
                break
              fi
              echo "· $dir：写入并重载后 /goldenkey/ 返回 $CODE，继续试下一个"
            done

            if [ -n "$SITE_DIR" ]; then
              # 清掉其它候选目录里的同名站点，避免重复 server / listen
              for dir in $CANDIDATES; do
                if [ "$dir" = "$SITE_DIR" ]; then continue; fi
                $SUDO rm -f "$dir/goldenkey-admin.conf" 2>/dev/null || true
              done
              $SUDO systemctl reload nginx 2>/dev/null || $SUDO nginx -s reload 2>/dev/null || true
            else
              NGINX_STATE=$( (command -v systemctl >/dev/null && $SUDO systemctl is-active nginx 2>/dev/null) || echo unknown)
              LOADED=$($SUDO nginx -T 2>/dev/null | grep -c 'listen 8088' || true)
              echo "::error::nginx 已在运行（$NGINX_STATE）但 8088 没有响应 /goldenkey/；配置里 listen 8088 共 ${LOADED:-0} 处"
              echo "::warning::nginx -t: $($SUDO nginx -t 2>&1 | tr '\n' '|' | cut -c1-300)"
              echo "::warning::nginx 配置路径: $($SUDO nginx -T 2>/dev/null | grep -m3 -E '^# configuration file' | tr '\n' ';' | cut -c1-400)"
              echo "::warning::8088 占用: $( ($SUDO ss -ltnp 2>/dev/null | grep ':8088' || echo 无) | tr '\n' ';' | cut -c1-200)"
              exit 1
            fi
          else
            echo "::warning::服务器未安装 nginx，静态文件已就位但不会对外提供"
          fi
          echo "Deploy completed at $(date '+%Y-%m-%d %H:%M:%S')"
          REMOTE
