name: Deploy GoldenKey Merchant Admin to ECS

# 触发：push 到 master（或手动 Run workflow）
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   ECS_HOST / ECS_USER / ECS_SSH_KEY（私钥全文）/ ECS_PORT（可选，默认 22）
# 服务器前置条件：nginx；静态产物落到 /opt/GoldenKeyAdmin。
# 访问路径：页面 /goldenkey/（构建 base=/goldenkey/），接口 /goldenkey/api/*。
# 站点配置以 deploy/nginx.goldenkey.conf 为准，内容有变化会被同步到服务器（失败自动回滚）。
on:
  push:
    branches: [master]
  workflow_dispatch:

# 与后端部署分开分组，互不取消；同一应用只允许一个部署
concurrency:
  group: deploy-goldenkey-admin
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DEPLOY_PATH: '/opt/GoldenKeyAdmin'
  NGINX_CONF: '/etc/nginx/conf.d/goldenkey-admin.conf'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 缺 secrets 时直接给出清单，而不是让 scp 抛一句 Could not resolve hostname
      - name: Preflight deploy secrets
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
        run: |
          set -e
          missing=""
          check() { [ -n "$2" ] || missing="$missing $1"; }
          check ECS_SSH_KEY "$SSH_KEY"
          check ECS_HOST "$R_HOST"
          check ECS_USER "$R_USER"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing（Settings → Secrets and variables → Actions 里补上）"
            exit 1
          fi
          echo "secrets 齐备"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist assets
        run: |
          set -e
          test -s dist/index.html
          for f in dist/assets/*.js; do node --check "$f"; done
          # 站点挂在 /goldenkey/ 下，产物必须引用 /goldenkey/assets/（base 配错会静默 404）
          grep -q '/goldenkey/assets/' dist/index.html || { echo "::error::index.html 未引用 /goldenkey/assets/，检查 vite.config.js 的 base"; exit 1; }
          # 产物清单用于服务器侧完整性校验（CSS 可能没有，用 find 避免通配落空）
          (cd dist && { sha256sum index.html; find assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sha256sum; } > MANIFEST.sha256)
          echo "dist OK: $(wc -l < dist/MANIFEST.sha256 | tr -d ' ') files verified, $(du -sh dist | cut -f1)"

      - name: Package dist
        run: |
          set -e
          # 带上 nginx 站点配置，服务器侧会与当前配置比对后同步
          cp deploy/nginx.goldenkey.conf dist/nginx.goldenkey.conf
          tar czf goldenkey-admin-dist.tar.gz -C dist .
          ls -lh goldenkey-admin-dist.tar.gz

      - name: Upload artifact to server (scp)
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
          R_PORT: ${{ secrets.ECS_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "Uploading $(du -h goldenkey-admin-dist.tar.gz | cut -f1) to ${R_HOST}:/tmp/ ..."
          timeout 300s scp -O \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -P "${R_PORT:-22}" \
            goldenkey-admin-dist.tar.gz "${R_USER}@${R_HOST}:/tmp/"
          echo "scp done"

      - name: Remote deploy (ssh)
        env:
          SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
          R_HOST: ${{ secrets.ECS_HOST }}
          R_USER: ${{ secrets.ECS_USER }}
          R_PORT: ${{ secrets.ECS_PORT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          timeout 420s ssh \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -p "${R_PORT:-22}" "${R_USER}@${R_HOST}" 'bash -s' <<'REMOTE'
          set -eo pipefail
          export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          NGINX_CONF="${{ env.NGINX_CONF }}"
          STAGE="$(mktemp -d /tmp/gk-admin-XXXXXX)"
          trap 'rm -rf "$STAGE"' EXIT

          tar xzf /tmp/goldenkey-admin-dist.tar.gz -C "$STAGE"
          rm -f /tmp/goldenkey-admin-dist.tar.gz
          (cd "$STAGE" && sha256sum -c MANIFEST.sha256)

          # 原子切换：前端产物无状态，旧目录整体替换
          rm -rf "$DEPLOY_PATH"
          mv "$STAGE" "$DEPLOY_PATH"
          trap - EXIT
          chmod -R 755 "$DEPLOY_PATH"
          echo "Admin deploy OK: $DEPLOY_PATH"

          # nginx 站点：以仓库里的 deploy/nginx.goldenkey.conf 为准，
          # 内容有变化就覆盖（覆盖前备份、nginx -t 不过就回滚）
          if command -v nginx >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo -n"; fi
            DESIRED="$DEPLOY_PATH/nginx.goldenkey.conf"
            if $SUDO test -d /etc/nginx/conf.d 2>/dev/null; then
              if [ ! -f "$NGINX_CONF" ] || ! cmp -s "$DESIRED" "$NGINX_CONF"; then
                $SUDO cp "$NGINX_CONF" /tmp/goldenkey-admin.conf.bak 2>/dev/null || true
                $SUDO cp "$DESIRED" "$NGINX_CONF"
                if $SUDO nginx -t 2>/dev/null; then
                  echo "nginx 站点配置已同步：$NGINX_CONF"
                else
                  if [ -f /tmp/goldenkey-admin.conf.bak ]; then
                    $SUDO cp /tmp/goldenkey-admin.conf.bak "$NGINX_CONF"
                    echo "::error::nginx -t 未通过，已还原上一版站点配置"
                  else
                    $SUDO rm -f "$NGINX_CONF"
                    echo "::error::nginx -t 未通过，已移除本次安装的站点配置"
                  fi
                  exit 1
                fi
              else
                echo "nginx 站点配置无变化"
              fi
              $SUDO nginx -t 2>/dev/null && {
                if ! RELOAD_OUT=$($SUDO systemctl reload nginx 2>&1); then
                  if ! RELOAD_OUT2=$($SUDO nginx -s reload 2>&1); then
                    echo "::warning::nginx 重载失败：$(printf '%s | %s' "$RELOAD_OUT" "$RELOAD_OUT2" | tr '\n' ' ' | cut -c1-400)"
                    $SUDO systemctl start nginx 2>/dev/null || true
                  fi
                fi
                echo "nginx 已重载"
              }
            else
              echo "::warning::无法写入 /etc/nginx/conf.d（缺 sudo 权限？），请手动安装 deploy/nginx.goldenkey.conf"
            fi
            # 站点入口自检：/goldenkey/ 必须返回 200
            NGINX_STATE=$( (command -v systemctl >/dev/null && $SUDO systemctl is-active nginx 2>/dev/null) || echo unknown)
            LOADED=$($SUDO nginx -T 2>/dev/null | grep -c 'listen 8088' || true)
            L8088=$( (($SUDO ss -ltn 2>/dev/null || $SUDO netstat -ltn 2>/dev/null) | grep ':8088' | tr -s ' ' | tr '\n' ';') || true)
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --noproxy '*' --max-time 5 "http://127.0.0.1:8088/goldenkey/" || true)
            if [ "$CODE" = "200" ]; then
              echo "站点自检通过：http://127.0.0.1:8088/goldenkey/ → 200"
            else
              echo "::warning::站点自检 http://127.0.0.1:8088/goldenkey/ 返回 $CODE（nginx=$NGINX_STATE，配置里 listen 8088 共 ${LOADED:-0} 处，8088 监听：${L8088:-无}）"
              # 把 nginx 侧的真实原因也带出来，省得反复猜
              echo "::warning::nginx -t: $($SUDO nginx -t 2>&1 | tr '\n' '|' | cut -c1-300)"
              echo "::warning::nginx 工作进程: $(pgrep -c nginx 2>/dev/null || echo 0)，8088 端口占用: $( ($SUDO ss -ltnp 2>/dev/null | grep ':8088' || echo 无) | tr '\n' ';' | cut -c1-200)"
              echo "::warning::journal: $($SUDO journalctl -u nginx -n 12 --no-pager 2>&1 | tr '\n' '|' | cut -c1-700)"
            fi
          else
            echo "::warning::服务器未安装 nginx，静态文件已就位但不会对外提供"
          fi
          echo "Deploy completed at $(date '+%Y-%m-%d %H:%M:%S')"
          REMOTE
