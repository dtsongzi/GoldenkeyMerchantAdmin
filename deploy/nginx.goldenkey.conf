# GoldenKey 商家管理后台（React + Vite 静态产物）nginx 站点配置
#
# 由 .github/workflows/deploy.yml 同步进 nginx 的 vhost 目录
# （宝塔 /www/server/panel/vhost/nginx、conf.d、sites-enabled 自动探测）。
#
# 访问路径（主站 rongyuevideo.com 上的实际路径）：
#   页面   https://<域名>/goldenkeyadmin/       构建产物 base=/goldenkeyadmin/
#   接口   https://<域名>/goldenkey/api/*       反代到 GoldenKeyServer:3001
#
# 依赖：同一台机器上 GoldenKeyServer 由 pm2 托管，监听 127.0.0.1:3001。
server {
    # 主站已占 80/443 时用独立端口，由主站 vhost 反代过来；
    # 若本机只有这一个站点，可改成 listen 80; + server_name 你的域名;
    listen 8088;
    server_name _;

    # 静态产物根目录（工作流把 dist 内容整体放到这里）
    root /opt/GoldenKeyAdmin;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # 根路径直接引导到站点入口
    location = / {
        return 302 /goldenkeyadmin/;
    }

    # 后端 API 反代到 GoldenKeyServer（前缀原样透传，不改写）
    location /goldenkey/api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 构建产物（base=/goldenkeyadmin/，实际路径 /goldenkeyadmin/assets/...）
    location /goldenkeyadmin/assets/ {
        alias /opt/GoldenKeyAdmin/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 页面本体：/goldenkeyadmin/ 及所有前端路由（/goldenkeyadmin/schedule 等）
    # 找不到对应文件时回退到入口页，交给 React Router
    # （不用 try_files：alias + try_files 在 nginx 上路径拼接有已知问题）
    location /goldenkeyadmin/ {
        alias /opt/GoldenKeyAdmin/;
        index index.html;
        error_page 404 = /goldenkeyadmin/index.html;
    }

    # 旧路径兜底：/goldenkey 不再是页面入口（/goldenkey/api 仍走上面的反代）
    location = /goldenkey {
        return 302 /goldenkeyadmin/;
    }

    # 其它路径一律回到站点入口
    location / {
        return 302 /goldenkeyadmin/;
    }
}
