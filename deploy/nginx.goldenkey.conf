# GoldenKey 商家管理后台（React + Vite 静态产物）nginx 站点配置
#
# 首次部署时由 .github/workflows/deploy.yml 复制到 /etc/nginx/conf.d/goldenkey-admin.conf。
# 已存在则工作流不会覆盖，后续调整请直接在服务器上改该文件。
#
# 访问路径：
#   页面   http://<host>:8088/goldenkey/          （构建产物 base=/goldenkey/）
#   接口   http://<host>:8088/goldenkey/api/*     （反代到 GoldenKeyServer:3001）
#
# 依赖：同一台机器上 GoldenKeyServer 由 pm2 托管，监听 127.0.0.1:3001。
server {
    # 80 端口若已被其它站点占用（例如 ReviewMaster），用独立端口对外；
    # 有域名时改成 listen 80; + server_name goldenkey.你的域名;
    listen 8088;
    server_name _;

    # 静态产物根目录（工作流把 dist 内容整体放到这里）
    root /opt/GoldenKeyAdmin;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # 根路径直接引导到 /goldenkey/
    location = / {
        return 302 /goldenkey/;
    }

    # 后端 API 反代到 GoldenKeyServer（前缀原样透传，不改写）
    # 必须放在 /goldenkey/ 之前，否则会被页面规则吃掉
    location /goldenkey/api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 构建产物（base=/goldenkey/，所以实际路径是 /goldenkey/assets/...）
    location /goldenkey/assets/ {
        alias /opt/GoldenKeyAdmin/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 页面本体：/goldenkey/ 与所有前端路由（/goldenkey/schedule 等）
    # 找不到对应文件时回退到入口页，交给 React Router 处理
    # （这里不用 try_files：alias + try_files 在 nginx 上路径拼接有已知问题）
    location /goldenkey/ {
        alias /opt/GoldenKeyAdmin/;
        index index.html;
        error_page 404 = /goldenkey/index.html;
    }

    # 其它路径一律回到站点入口
    location / {
        return 302 /goldenkey/;
    }
}
