# GoldenKey 商家管理后台（React + Vite 静态产物）nginx 站点配置
#
# 首次部署时由 .github/workflows/deploy.yml 复制到 /etc/nginx/conf.d/goldenkey-admin.conf。
# 已存在则工作流不会覆盖，后续调整请直接在服务器上改该文件。
#
# 依赖：同一台机器上 GoldenKeyServer 由 pm2 托管，监听 127.0.0.1:3001。
server {
    # 80 端口若已被其它站点占用（例如 ReviewMaster），用独立端口对外；
    # 有域名时改成 listen 80; + server_name goldenkey.你的域名;
    listen 8088;
    server_name _;

    root /opt/GoldenKeyAdmin;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # SPA 路由（BrowserRouter）：刷新 /schedule 这类地址时回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 后端 API 反代到 GoldenKeyServer（接口前缀 /goldenkey/api，原样透传不改写）
    location /goldenkey/api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
